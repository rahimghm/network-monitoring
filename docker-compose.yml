services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-20}
      SNMP_TIMEOUT: ${SNMP_TIMEOUT:-3}
      SNMP_RETRIES: ${SNMP_RETRIES:-1}
      HOSTNAME_CACHE_TTL_SECONDS: ${HOSTNAME_CACHE_TTL_SECONDS:-60}
      DNS_ENABLED: ${DNS_ENABLED:-false}
      DNS_SERVER: ${DNS_SERVER:-}
      DNS_PORT: ${DNS_PORT:-53}
      DNS_TIMEOUT: ${DNS_TIMEOUT:-3}
      DNS_DOMAIN: ${DNS_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
